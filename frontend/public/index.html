<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundial FIFA 2026</title>
  <link rel="stylesheet" href="/src/css/styles.css">
</head>
<body>

  <header>
    <img class="logo" src="https://crests.football-data.org/wm26.png" alt="FIFA 2026">
    <h1>FIFA World Cup 2026</h1>
    <div class="header-controls">
      <button id="clear-sims-btn" class="clear-sims-btn" type="button" hidden>
        🧹 Limpiar simulaciones <span id="clear-sims-count" class="clear-sims-count"></span>
      </button>
      <div class="refresh-info">Actualización en <span id="refresh-countdown">60</span>s</div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="panel-groups">Grupos</button>
    <button class="tab-btn" data-tab="panel-fixtures">Partidos</button>
  </nav>

  <main>
    <div id="panel-groups" class="tab-panel active">
      <div id="groups-container" class="loading">Cargando grupos...</div>
    </div>

    <div id="panel-fixtures" class="tab-panel">
      <div id="fixtures-filters" class="fixtures-filters"></div>
      <div id="fixtures-container" class="loading">Cargando partidos...</div>
    </div>
  </main>

  <script src="/src/js/api.js"></script>
  <script src="/src/js/third_place_lookup.js"></script>
  <script src="/src/js/app.js"></script>
</body>
</html>
